name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # Preview builds use the PRODUCTION site URL on purpose: the canonical
          # tag then marks every preview as a duplicate of production, so a
          # preview URL cannot compete with the real page in search results.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}

      # HARD GATE, production only. The copy ships with bracketed placeholders
      # deliberately until launch, so this cannot run on pull requests -- it
      # would leave CI red for the whole build phase and train everyone to
      # ignore it. On PRs the CI workflow reports the same list without failing.
      - name: Placeholder gate
        if: github.ref == 'refs/heads/main'
        run: pnpm run placeholders

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        run: pnpm exec wrangler versions upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
